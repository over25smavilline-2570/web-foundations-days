<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your minimalist note-taking assistant</p>
    </header>

    <main>
        <section class="form-section">
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note Content (max 200 chars):</label>
                    <input type="text" id="note-input" placeholder="Type your note here...">
                </div>
                
                <div class="form-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-btn">Add Note</button>
            </form>
            <p id="error-message" class="error-text"></p>
        </section>

        <section class="notes-section">
            <h2>Your notes</h2>
            <input type="text" id="search-input" placeholder="Search notes...">
            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes App</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
